name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (optional, e.g., 6.20.3-1 or 6.20.4). If not provided, will use version from version.h'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publish to Maven repository'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  # Fixed environment versions
  UBUNTU_VERSION: '22.04'
  MACOS_VERSION: '15'
  
  # Fixed compiler versions
  CC: clang
  CXX: clang++
  CLANG_VERSION: '15'
  
  # Fixed Java version
  JAVA_VERSION: '8'
  JAVA_DISTRIBUTION: 'zulu'
  
  # Release mode (no debug)
  DEBUG_LEVEL: '0'

jobs:
  # ========================================
  # Build Native Libraries for Release
  # ========================================
  
  build-native-linux:
    name: Build Linux Native (x86_64 glibc)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Build Linux Native Library (x86_64 glibc) - Release Mode
        run: |
          echo "Building release library with DEBUG_LEVEL=${{ env.DEBUG_LEVEL }}..."
          make jclean clean
          make rocksdbjavastaticdockerx86_64
        env:
          USE_CLANG: 1
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Verify native library
        run: |
          ls -lh java/target/librocksdbjni-linux64.so
          file java/target/librocksdbjni-linux64.so
          echo "Library size: $(du -h java/target/librocksdbjni-linux64.so | cut -f1)"

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x86_64
          path: java/target/librocksdbjni-linux64.so
          retention-days: 30

  # macOS build disabled - enable if needed
  # build-native-macos:
  #   ...

  # ========================================
  # Package Java JAR with All Native Libraries
  # ========================================
  
  collect-native-libraries:
    name: Collect Native Libraries
    runs-on: ubuntu-22.04
    needs: [build-native-linux]
    # Run if build-native-linux completed (success or failure, but not cancelled)
    if: |
      always() && 
      !cancelled() &&
      !contains(needs.*.result, 'cancelled')
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout code (for version info)
        uses: actions/checkout@v4

      - name: Download all native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: 'native-*'
          path: native-libraries/
          merge-multiple: false

      - name: Organize native libraries
        run: |
          mkdir -p native-libs-collected
          find native-libraries/ -type f \( -name "*.so" -o -name "*.jnilib" \) -exec cp -v {} native-libs-collected/ \;
          echo "📦 Native libraries collected:"
          ls -lh native-libs-collected/

      - name: Get version
        id: version
        run: |
          # Check if manual version is provided
          MANUAL_VERSION="${{ github.event.inputs.version }}"
          
          if [ -n "$MANUAL_VERSION" ]; then
            # Use manual version
            VERSION="$MANUAL_VERSION"
            echo "📦 Using MANUAL version: $VERSION"
          else
            # Auto-detect from version.h
            ROCKSDB_MAJOR=$(grep -E '^#define ROCKSDB_MAJOR ' include/rocksdb/version.h | awk '{print $3}')
            ROCKSDB_MINOR=$(grep -E '^#define ROCKSDB_MINOR ' include/rocksdb/version.h | awk '{print $3}')
            ROCKSDB_PATCH=$(grep -E '^#define ROCKSDB_PATCH ' include/rocksdb/version.h | awk '{print $3}')
            VERSION="${ROCKSDB_MAJOR}.${ROCKSDB_MINOR}.${ROCKSDB_PATCH}"
            echo "📦 Using AUTO-DETECTED version: $VERSION"
          fi
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Final version: $VERSION"

      - name: Upload native libraries for Maven deploy
        uses: actions/upload-artifact@v4
        with:
          name: native-libraries-for-maven
          path: native-libs-collected/
          retention-days: 7

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          MANUAL_VERSION="${{ github.event.inputs.version }}"
          
          echo "## 📦 Native Libraries Collected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Version: \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$MANUAL_VERSION" ]; then
            echo "**Source**: Manual input" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Source**: Auto-detected from \`version.h\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Native Libraries:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linux x86_64 (glibc)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh native-libs-collected/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ **Java compilation, packaging, and deployment will be done by Maven in the publish job**" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ This eliminates redundant compilation!" >> $GITHUB_STEP_SUMMARY

  # ========================================
  # Publish to Maven Central
  # ========================================
  
  publish:
    name: Publish to Maven Central (Central Portal)
    runs-on: ubuntu-22.04
    needs: [collect-native-libraries]
    if: ${{ github.event.inputs.publish == 'true' }}
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_REPO_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_REPO_PASSWORD }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK and import GPG key
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: native-libraries-for-maven
          path: java/target/classes/

      - name: Configure Maven settings.xml for Central Portal
        run: |
          echo "🔧 Creating settings.xml for Central Portal..."
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${MAVEN_USERNAME}</username>
                <password>${MAVEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
          echo "✅ settings.xml created for Central Portal"

      - name: Verify Configuration
        run: |
          echo "🔍 =========================================="
          echo "🔍 CONFIGURATION VERIFICATION"
          echo "🔍 =========================================="
          echo ""
          
          echo "📋 Environment Variables:"
          echo "  MAVEN_USERNAME: $([ -n "$MAVEN_USERNAME" ] && echo '✅ SET (length: '${#MAVEN_USERNAME}')' || echo '❌ NOT SET')"
          echo "  MAVEN_PASSWORD: $([ -n "$MAVEN_PASSWORD" ] && echo '✅ SET (length: '${#MAVEN_PASSWORD}')' || echo '❌ NOT SET')"
          echo "  GPG_PASSPHRASE: $([ -n "$GPG_PASSPHRASE" ] && echo '✅ SET (length: '${#GPG_PASSPHRASE}')' || echo '❌ NOT SET')"
          echo ""
          
          echo "📦 Native Libraries:"
          ls -lh java/target/classes/librocksdbjni-* || echo "⚠️ No native libraries found"
          echo ""
          
          echo "🔐 GPG Keys:"
          gpg --list-secret-keys --keyid-format LONG || echo "⚠️ No GPG keys"
          echo ""
          
          echo "☕ Maven & Java:"
          mvn --version
          echo ""
          echo "✅ Verification complete"
          echo "🔍 =========================================="

      - name: Prepare POM for Maven
        run: |
          VERSION="${{ needs.collect-native-libraries.outputs.version }}"
          MANUAL_VERSION="${{ github.event.inputs.version }}"
          
          echo "📦 Preparing for version: $VERSION"
          
          # If manual version is provided, update version.h to ensure consistency
          if [ -n "$MANUAL_VERSION" ]; then
            echo "🔧 Manual version detected: $MANUAL_VERSION"
            echo "🔧 Updating version.h to ensure Maven uses correct version..."
            
            # Parse manual version (e.g., 6.20.3-010404 or 6.20.4)
            # Extract base version (major.minor.patch) from manual version
            BASE_VERSION=$(echo "$MANUAL_VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
            MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
            PATCH=$(echo "$BASE_VERSION" | cut -d. -f3)
            
            echo "   Base version: $BASE_VERSION (MAJOR=$MAJOR, MINOR=$MINOR, PATCH=$PATCH)"
            
            # Backup original version.h
            cp include/rocksdb/version.h include/rocksdb/version.h.backup
            
            # Update version.h with parsed version
            sed -i "s/^#define ROCKSDB_MAJOR .*/#define ROCKSDB_MAJOR $MAJOR/" include/rocksdb/version.h
            sed -i "s/^#define ROCKSDB_MINOR .*/#define ROCKSDB_MINOR $MINOR/" include/rocksdb/version.h
            sed -i "s/^#define ROCKSDB_PATCH .*/#define ROCKSDB_PATCH $PATCH/" include/rocksdb/version.h
            
            echo "✅ version.h updated"
            echo "📄 New version.h content:"
            grep -E "^#define ROCKSDB_(MAJOR|MINOR|PATCH) " include/rocksdb/version.h
          else
            echo "ℹ️ Using auto-detected version from version.h (no manual override)"
          fi
          
          echo ""
          echo "📝 Generating POM from template..."
          cd java
          # Generate POM from template
          sed "s/\${FROCKSDB_JAVA_VERSION}/$VERSION/g" pom.xml.template > pom.xml
          
          echo "✅ POM prepared"
          echo "📄 POM Preview (first 40 lines):"
          head -40 pom.xml

      - name: Deploy to Central Portal via Maven
        run: |
          set -e
          VERSION="${{ needs.collect-native-libraries.outputs.version }}"
          
          echo "🚀 =========================================="
          echo "🚀 DEPLOYING TO CENTRAL PORTAL VIA MAVEN"
          echo "🚀 =========================================="
          echo ""
          echo "📦 Version: $VERSION"
          echo "🌐 Target: https://central.sonatype.com"
          echo "🔧 Method: mvn deploy (via central-publishing-maven-plugin)"
          echo ""
          echo "ℹ️ Maven will:"
          echo "   1. Compile Java source code"
          echo "   2. Package JAR with native libraries"
          echo "   3. Generate sources JAR"
          echo "   4. Generate javadoc JAR"
          echo "   5. Sign all artifacts with GPG"
          echo "   6. Deploy to Central Portal"
          echo "   7. Auto-publish after validation"
          echo ""
          
          cd java
          
          # Run mvn deploy - Maven will do everything in one go
          echo "📤 Running Maven deploy..."
          mvn deploy \
            -DskipTests \
            -Dgpg.passphrase="${GPG_PASSPHRASE}" \
            -Dgpg.gpgArguments=--pinentry-mode,loopback \
            --batch-mode
          
          echo ""
          echo "🎉 =========================================="
          echo "🎉 DEPLOYMENT SUCCESSFUL"
          echo "🎉 =========================================="
          echo "✅ Artifacts compiled, packaged, and deployed by Maven"
          echo "✅ Auto-publishing enabled (via POM configuration)"
          echo "✅ Version: ${VERSION}"
          echo ""
          echo "📝 The artifacts will be available on Maven Central shortly"
          echo "📝 Check status at: https://central.sonatype.com/publishing"

      - name: Deployment Summary
        if: success()
        run: |
          VERSION="${{ needs.collect-native-libraries.outputs.version }}"
          MANUAL_VERSION="${{ github.event.inputs.version }}"
          
          echo "## 🚀 Published to Maven Central" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$MANUAL_VERSION" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** This version was manually specified (not from \`version.h\`)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Method:** Central Portal API (central-publishing-maven-plugin)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Deployed Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- \`frocksdbjni-${VERSION}.jar\` (main)" >> $GITHUB_STEP_SUMMARY
          echo "- \`frocksdbjni-${VERSION}-sources.jar\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`frocksdbjni-${VERSION}-javadoc.jar\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`frocksdbjni-${VERSION}.pom\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "The artifacts are being published automatically to Maven Central." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Monitor progress at: [Central Portal](https://central.sonatype.com/publishing)" >> $GITHUB_STEP_SUMMARY

